name: Electron Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'client/**'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - app_host: epic
            artifact: loot-survivor-2-win-x64-epic
          - app_host: steam
            artifact: loot-survivor-2-win-x64-steam
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install

      - name: Build Electron TypeScript
        working-directory: client
        run: npx tsc -p electron/tsconfig.json

      - name: Build Vite
        working-directory: client
        env:
          VITE_PUBLIC_PLATFORM: desktop
          VITE_PUBLIC_APP_HOST: ${{ matrix.app_host }}
        run: npx vite build

      - name: Build Windows executable
        working-directory: client
        run: npx electron-builder --win --config.win.target=dir

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: client/release/win-unpacked/
          retention-days: 30
